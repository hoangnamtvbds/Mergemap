<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FMCG Master Map Merger - NPP Bến Cát</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    #map { height: 100%; width: 100%; background: #e2e8f0; }
    .leaflet-popup-content-wrapper { border-radius: 10px; font-size: 12px; }
  </style>
</head>
<body class="bg-slate-100 h-screen w-screen flex flex-col font-sans overflow-hidden text-slate-800">

  <!-- TOPBAR -->
  <header class="bg-slate-900 text-white px-3 py-2 flex items-center justify-between shadow shrink-0 border-b border-slate-800">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white shadow">
        <i data-lucide="map-pin" class="w-4 h-4"></i>
      </div>
      <div>
        <h1 class="text-xs md:text-sm font-bold tracking-tight flex items-center gap-1.5">
          FMCG Master Map Merger
          <span id="savedIndicator" class="hidden text-[10px] bg-emerald-500/20 text-emerald-400 font-medium px-1.5 py-0.2 rounded border border-emerald-500/30">
            <i data-lucide="check" class="w-3 h-3 inline"></i> Đã tự lưu
          </span>
        </h1>
        <p class="text-[10px] text-slate-400">Chuẩn hóa KiotViet làm gốc x DMS Carlsberg</p>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center space-x-1.5">
      <!-- 1. Kiotviet File -->
      <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-[11px] px-2 py-1.5 rounded border border-slate-700 flex items-center gap-1 transition">
        <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5 text-emerald-400"></i>
        <span id="labelKv" class="hidden sm:inline">1. Hóa đơn KiotViet</span>
        <input type="file" id="fileKv" accept=".xlsx, .xls" class="hidden">
      </label>

      <!-- 2. DMS File -->
      <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-[11px] px-2 py-1.5 rounded border border-slate-700 flex items-center gap-1 transition">
        <i data-lucide="database" class="w-3.5 h-3.5 text-blue-400"></i>
        <span id="labelDms" class="hidden sm:inline">2. Tọa độ DMS</span>
        <input type="file" id="fileDms" accept=".xlsx, .xls" class="hidden">
      </label>

      <!-- Run Button -->
      <button id="btnRun" onclick="runMatchingPipeline()" disabled class="bg-slate-700 text-slate-400 text-[11px] font-semibold px-2.5 py-1.5 rounded flex items-center gap-1 cursor-not-allowed transition">
        <i data-lucide="zap" class="w-3.5 h-3.5"></i>
        <span>Khớp dữ liệu</span>
      </button>

      <!-- Export Excel -->
      <button onclick="exportMasterExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-semibold px-2.5 py-1.5 rounded shadow flex items-center gap-1 transition">
        <i data-lucide="download" class="w-3.5 h-3.5"></i>
        <span class="font-bold">Xuất Master Excel</span>
      </button>

      <!-- Reset Memory -->
      <button onclick="resetAllData()" title="Xóa dữ liệu cũ & làm mới" class="bg-slate-800 hover:bg-rose-900 text-slate-400 hover:text-rose-200 text-[11px] p-1.5 rounded border border-slate-700 transition">
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
      </button>
    </div>
  </header>

  <!-- WORKSPACE -->
  <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
    
    <!-- LEFT PANEL: DANH SÁCH KHÁCH HÀNG KIOTVIET (450px) -->
    <aside class="w-full md:w-[460px] bg-white border-r border-slate-200 flex flex-col shrink-0 z-10 shadow md:shadow-none h-1/2 md:h-full">
      
      <!-- STATS STRIP -->
      <div class="grid grid-cols-4 gap-1 p-2 bg-slate-50 border-b border-slate-200 text-center text-xs">
        <div class="p-1 rounded bg-white border">
          <div class="text-[10px] text-slate-500">Gốc KiotViet</div>
          <div id="statTotal" class="font-bold text-slate-800">0</div>
        </div>
        <div class="p-1 rounded bg-white border">
          <div class="text-[10px] text-emerald-600">Đã có Map</div>
          <div id="statMatched" class="font-bold text-emerald-600">0</div>
        </div>
        <div class="p-1 rounded bg-white border">
          <div class="text-[10px] text-amber-600">Gợi ý trùng</div>
          <div id="statSuggest" class="font-bold text-amber-600">0</div>
        </div>
        <div class="p-1 rounded bg-white border">
          <div class="text-[10px] text-rose-500">Chưa có Map</div>
          <div id="statPending" class="font-bold text-rose-500">0</div>
        </div>
      </div>

      <!-- SEARCH & TABS -->
      <div class="p-2 border-b border-slate-200 bg-white space-y-1.5 shrink-0">
        <div class="relative">
          <i data-lucide="search" class="w-3.5 h-3.5 absolute left-2.5 top-2.5 text-slate-400"></i>
          <input type="text" id="searchInput" oninput="filterCustomerList()" placeholder="Tìm theo tên quán, SĐT, đường (D8, ĐT744, XC6...)" class="w-full pl-8 pr-2 py-1 text-xs bg-slate-100 rounded border border-slate-200 focus:outline-none focus:border-blue-500">
        </div>

        <div class="flex gap-1 text-[11px] font-medium bg-slate-100 p-0.5 rounded">
          <button onclick="changeTab('suggest')" id="tabBtnSuggest" class="flex-1 py-1 text-center rounded font-semibold text-amber-800 bg-white shadow-sm">
            Gợi ý (<span id="badgeSuggest">0</span>)
          </button>
          <button onclick="changeTab('pending')" id="tabBtnPending" class="flex-1 py-1 text-center rounded text-slate-600">
            Chưa có (<span id="badgePending">0</span>)
          </button>
          <button onclick="changeTab('matched')" id="tabBtnMatched" class="flex-1 py-1 text-center rounded text-slate-600">
            Đã có (<span id="badgeMatched">0</span>)
          </button>
        </div>
      </div>

      <!-- LIST VIEW -->
      <div id="customerListView" class="flex-1 overflow-y-auto divide-y divide-slate-100">
        <div class="p-6 text-center text-xs text-slate-400">
          Chưa có dữ liệu. Vui lòng nạp file Hóa đơn KiotViet và Tọa độ DMS ở thanh công cụ phía trên.
        </div>
      </div>

      <!-- SELECTED BAR & MANUAL GPS / ZALO -->
      <div class="p-2 bg-slate-900 text-white border-t border-slate-800 text-xs shrink-0 flex items-center justify-between gap-2">
        <div class="flex-1 truncate">
          <span class="text-slate-400">Đang chọn: </span>
          <span id="selectedCustName" class="font-bold text-blue-300">Chưa chọn quán</span>
        </div>
        <button onclick="openZaloLinkModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-2 py-1 rounded text-[11px] font-semibold flex items-center gap-1 shrink-0">
          <i data-lucide="link" class="w-3.5 h-3.5"></i> Dán Link Map / Zalo
        </button>
      </div>
    </aside>

    <!-- RIGHT PANEL: INTERACTIVE MAP -->
    <section class="flex-1 flex flex-col relative h-1/2 md:h-full bg-slate-200">
      
      <!-- MAP LAYER TOGGLE & STATUS -->
      <div class="absolute top-2 left-2 z-[1000] flex items-center gap-2 pointer-events-none">
        <div class="bg-white/95 backdrop-blur px-2.5 py-1 rounded shadow text-xs font-semibold text-slate-700 pointer-events-auto" id="mapStatusText">
          Bản đồ giao thông Google Road
        </div>
        <button onclick="switchTileLayer()" class="bg-white hover:bg-slate-50 px-2 py-1 rounded shadow text-[11px] font-medium text-blue-600 border border-slate-200 pointer-events-auto flex items-center gap-1">
          <i data-lucide="layers" class="w-3 h-3"></i> <span id="layerNameText">Đổi nền Map</span>
        </button>
      </div>

      <div id="map"></div>
    </section>
  </main>

  <!-- MODAL: DÁN LINK ZALO / GOOGLE MAPS -->
  <div id="zaloModal" class="fixed inset-0 bg-black/60 z-[2000] hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-md w-full p-4 shadow-xl space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-800 text-xs truncate">Gán tọa độ cho: <span id="modalCustName" class="text-blue-600"></span></h3>
        <button onclick="closeZaloLinkModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div class="space-y-1 text-xs">
        <label class="text-slate-600">Dán Link Google Maps / Link Zalo hoặc Tọa độ thẳng (Lat, Long):</label>
        <textarea id="modalUrlInput" rows="3" placeholder="https://maps.app.goo.gl/... hoặc 11.16892, 106.61245" class="w-full p-2 border rounded text-xs bg-slate-50 focus:bg-white focus:outline-none focus:border-blue-500"></textarea>
      </div>
      <div class="flex justify-end gap-2">
        <button onclick="closeZaloLinkModal()" class="px-3 py-1 rounded border text-xs text-slate-600 hover:bg-slate-50">Hủy</button>
        <button onclick="applyManualCoordinates()" class="px-3 py-1 rounded bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold">Xác nhận</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. NGUỒN BẢN ĐỒ GOOGLE TIÊU CHUẨN - KHÔNG KEY - KHÔNG LỖI TRẮNG
    // =========================================================================
    let map = null;
    let currentTileLayer = null;
    let dmsLayerGroup = null;
    let selectedMarkerGroup = null;
    const BEN_CAT_CENTER = [11.168, 106.612];

    const TILE_SOURCES = [
      {
        name: "Google Road Map",
        url: "https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}",
        subdomains: []
      },
      {
        name: "OpenStreetMap",
        url: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        subdomains: ["a", "b", "c"]
      },
      {
        name: "Google Satellite (Vệ tinh)",
        url: "https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}",
        subdomains: []
      }
    ];
    let tileIndex = 0;

    function initMap() {
      map = L.map('map', {
        center: BEN_CAT_CENTER,
        zoom: 13,
        zoomControl: true,
        preferCanvas: true
      });

      setMapTile(0);

      dmsLayerGroup = L.layerGroup().addTo(map);
      selectedMarkerGroup = L.layerGroup().addTo(map);

      setTimeout(() => { map.invalidateSize(); }, 300);
      window.addEventListener('resize', () => { map.invalidateSize(); });
    }

    function setMapTile(idx) {
      if (currentTileLayer) map.removeLayer(currentTileLayer);
      tileIndex = idx;
      let src = TILE_SOURCES[tileIndex];
      currentTileLayer = L.tileLayer(src.url, {
        maxZoom: 20,
        subdomains: src.subdomains,
        attribution: '&copy; Map Data'
      }).addTo(map);
      document.getElementById('mapStatusText').innerText = "Bản đồ: " + src.name;
    }

    function switchTileLayer() {
      let nextIdx = (tileIndex + 1) % TILE_SOURCES.length;
      setMapTile(nextIdx);
    }

    // =========================================================================
    // 2. TỰ ĐỘNG LƯU VÀO LOCALSTORAGE - KHÔNG SỢ MẤT DỮ LIỆU KHI F5
    // =========================================================================
    const STORAGE_KEY_KV = "FMCG_MASTER_KV_DATA_V2";
    const STORAGE_KEY_DMS = "FMCG_MASTER_DMS_DATA_V2";

    let kvList = [];
    let dmsList = [];
    let selectedCustId = null;
    let currentTab = 'suggest';

    function saveStateToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY_KV, JSON.stringify(kvList));
        if (dmsList.length > 0 && dmsList.length < 5500) {
          let miniDms = dmsList.map(d => ({ code: d.code, name: d.name, addr: d.addr, stdPhone: d.stdPhone, lat: d.lat, lon: d.lon }));
          localStorage.setItem(STORAGE_KEY_DMS, JSON.stringify(miniDms));
        }
        let ind = document.getElementById('savedIndicator');
        ind.classList.remove('hidden');
        setTimeout(() => ind.classList.add('hidden'), 2500);
      } catch (e) {
        console.warn("Storage full or blocked:", e);
      }
    }

    function loadStateFromStorage() {
      let savedKv = localStorage.getItem(STORAGE_KEY_KV);
      let savedDms = localStorage.getItem(STORAGE_KEY_DMS);
      if (savedKv) {
        try {
          kvList = JSON.parse(savedKv);
          if (savedDms) {
            dmsList = JSON.parse(savedDms);
            renderDmsMarkersOnMap();
          }
          updateStatistics();
          renderCustomerList();
          document.getElementById('mapStatusText').innerText = `Đã phục hồi ${kvList.length} KH KiotViet đã lưu`;
          lucide.createIcons();
          return true;
        } catch (e) {
          console.error(e);
        }
      }
      return false;
    }

    function resetAllData() {
      if (confirm("Anh có chắc muốn XÓA DỮ LIỆU ĐÃ GHÉP để nạp và làm lại từ đầu không?")) {
        localStorage.removeItem(STORAGE_KEY_KV);
        localStorage.removeItem(STORAGE_KEY_DMS);
        location.reload();
      }
    }

    // =========================================================================
    // 3. THUẬT TOÁN ĐỐI SOÁT & TIỀN XỬ LÝ ĐỊA BÀN
    // =========================================================================
    const ROAD_REGEX = /\b(db\d+[a-z]?|xc\d+[a-z]?|dj\d+[a-z]?|da\d+[a-z]?|dc\d+[a-z]?|dd\d+[a-z]?|na\d+[a-z]?|nb\d+[a-z]?|nc\d+[a-z]?|ne\d+[a-z]?|n\d+[a-z]?|d\d+[a-z]?|dt\s*7\d+[a-z]?|dh\s*\d+[a-z]?|ql\s*1[34]|hl\s*\d+|rach bap|ben suc|minh hung|tan lap|an dien|an tay|my phuoc\s*[1234]?|thoi hoa|hoa loi|chanh phu hoa|phu an|lai uyen|lai hung|long nguyen|tru van tho|cay truong|thanh tuyen|thanh an|dinh hoa|hiep an|vinh phu)\b/gi;
    const STOPWORDS = /\b(tap hoa|th|bach hoa|bh|dai ly|dl|quan|nha hang|nh|tiem|cua hang|ch|sri|mini|mart|co|chu|anh|chi|ba|ong|em|di|bac|nghi trua.*|khu pho|kp|ap|to|duong|phuong|xa|thi tran|ben cat|binh duong|bau bang|dau tieng|thuan an|thu dau mot)\b/gi;

    function removeDiacritics(str) {
      if (!str) return '';
      return String(str).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    function cleanPhone(raw) {
      if (!raw) return { p9: '', std: '' };
      let s = String(raw).split('.')[0].replace(/\D/g, '');
      if (s.startsWith('84') && s.length >= 10) s = s.substring(2);
      s = s.replace(/^0+/, '');
      if (s.length >= 9) {
        let p9 = s.slice(-9);
        return { p9: p9, std: '0' + p9 };
      }
      return { p9: '', std: '' };
    }

    function extractRoads(text) {
      if (!text) return new Set();
      let t = removeDiacritics(text).replace(/\b(dt|dh|ql|hl)\s+(\d+)/g, '$1$2').replace(/[^\w\s]/g, ' ');
      let matches = t.match(ROAD_REGEX);
      return new Set(matches ? matches.map(m => m.trim().toLowerCase()) : []);
    }

    function extractCoreTokens(text) {
      if (!text) return [];
      let s = removeDiacritics(text);
      s = s.replace(/\(.*?\)|\[.*?\]/g, ' ').replace(/\b\d{1,2}h\d{0,2}\b/g, ' ');
      s = s.replace(ROAD_REGEX, ' ').replace(/[^\w\s]/g, ' ').replace(STOPWORDS, ' ');
      return s.split(/\s+/).filter(w => w.length > 1 || !isNaN(w));
    }

    function calcJaccardSimilarity(arr1, arr2) {
      if (!arr1.length || !arr2.length) return 0;
      let set1 = new Set(arr1);
      let set2 = new Set(arr2);
      let inter = new Set([...set1].filter(x => set2.has(x)));
      let union = new Set([...set1, ...set2]);
      return union.size ? (inter.size / union.size) * 100 : 0;
    }

    // =========================================================================
    // 4. ĐỌC FILE TỰ ĐỘNG & BẢO ĐẢM KIOTVIET LÀM GỐC 100%
    // =========================================================================
    let kvWorkbookRaw = null;
    let dmsWorkbookRaw = null;

    document.getElementById('fileKv').addEventListener('change', function(e) {
      let file = e.target.files[0];
      if (!file) return;
      document.getElementById('labelKv').innerText = file.name.substring(0, 12) + '...';
      let reader = new FileReader();
      reader.onload = e => { kvWorkbookRaw = XLSX.read(new Uint8Array(e.target.result), { type: 'array' }); checkCanRun(); };
      reader.readAsArrayBuffer(file);
    });

    document.getElementById('fileDms').addEventListener('change', function(e) {
      let file = e.target.files[0];
      if (!file) return;
      document.getElementById('labelDms').innerText = file.name.substring(0, 12) + '...';
      let reader = new FileReader();
      reader.onload = e => { dmsWorkbookRaw = XLSX.read(new Uint8Array(e.target.result), { type: 'array' }); checkCanRun(); };
      reader.readAsArrayBuffer(file);
    });

    function checkCanRun() {
      if (kvWorkbookRaw && dmsWorkbookRaw) {
        let btn = document.getElementById('btnRun');
        btn.disabled = false;
        btn.className = "bg-blue-600 hover:bg-blue-500 text-white text-[11px] font-semibold px-2.5 py-1.5 rounded flex items-center gap-1 shadow cursor-pointer transition";
      }
    }

    function runMatchingPipeline() {
      document.getElementById('mapStatusText').innerText = "Đang xử lý KiotViet làm gốc...";

      // 1. Đọc DMS làm kho tham chiếu tọa độ
      let dmsRows = XLSX.utils.sheet_to_json(dmsWorkbookRaw.Sheets[dmsWorkbookRaw.SheetNames[0]]);
      dmsList = [];
      let dmsP9Map = {};

      dmsRows.forEach(row => {
        let lat = parseFloat(row['La'] || row['Lat'] || row['Vĩ độ']);
        let lon = parseFloat(row['Long'] || row['Lon'] || row['Kinh độ']);
        if (isNaN(lat) || isNaN(lon)) return;

        let code = String(row['Mã khách hàng'] || row['Mã KH'] || row['CD'] || '');
        let name = String(row['Tên khách hàng'] || row['Tên KH'] || '');
        let addr = String(row['Địa chỉ'] || '');
        let phone = row['SDT'] || row['Điện thoại'] || '';
        let { p9, std } = cleanPhone(phone);
        let tokens = extractCoreTokens(name);
        let roads = extractRoads(name + ' ' + addr);

        let item = { code, name, addr, stdPhone: std, lat, lon, p9, tokens, roads };
        dmsList.push(item);
        if (p9) {
          if (!dmsP9Map[p9]) dmsP9Map[p9] = [];
          dmsP9Map[p9].push(item);
        }
      });

      // 2. Tự động tìm cột KiotViet
      let kvRows = XLSX.utils.sheet_to_json(kvWorkbookRaw.Sheets[kvWorkbookRaw.SheetNames[0]]);
      if (!kvRows.length) return alert("File KiotViet không có dữ liệu!");

      let kvKeys = Object.keys(kvRows[0]);
      let colId = kvKeys.find(k => /^mã khách hàng|^mã kh/i.test(k.trim())) || kvKeys.find(k => /mã/i.test(k));
      let colName = kvKeys.find(k => /^tên khách hàng|^tên kh/i.test(k.trim())) || kvKeys.find(k => /tên/i.test(k));
      let colPhone = kvKeys.find(k => /^điện thoại$|^sđt|^số điện thoại/i.test(k.trim())) || 'Điện thoại';
      let colAddr = kvKeys.find(k => /^địa chỉ \(khách hàng\)|^địa chỉ/i.test(k.trim())) || 'Địa chỉ (Khách hàng)';

      // GOM NHÓM UNIQUE THEO MÃ KHÁCH HÀNG KIOTVIET (BẢO VỆ GỐC KIOTVIET)
      let kvMap = new Map();
      kvRows.forEach(row => {
        let id = row[colId];
        if (!id) return;
        let p = row[colPhone];
        let a = row[colAddr];
        let score = (p ? 2 : 0) + (a ? 1 : 0);
        if (!kvMap.has(id) || kvMap.get(id).score < score) {
          kvMap.set(id, { row, score });
        }
      });

      let uniqueKv = Array.from(kvMap.values()).map(v => v.row);
      kvList = [];

      uniqueKv.forEach(kv => {
        let id = kv[colId];
        let name = String(kv[colName] || '');
        let addr = String(kv[colAddr] || '');
        let phoneRaw = kv[colPhone] || '';
        let { p9, std } = cleanPhone(phoneRaw);
        let tokens = extractCoreTokens(name);
        let fullText = name + ' ' + addr;
        let roads = extractRoads(fullText);

        let matched = null;
        let tier = 'Chưa có Map';
        let status = 'pending';
        let suggestedDms = null;
        let matchScore = 0;

        // Tầng 1: Regex GPS có sẵn
        let gpsMatch = fullText.match(/(1[0-2]\.\d{4,8})\s*[,;/\-\s]\s*(10[5-7]\.\d{4,8})/);
        if (gpsMatch) {
          matched = { lat: parseFloat(gpsMatch[1]), lon: parseFloat(gpsMatch[2]), addr: addr, name: name };
          tier = 'Tầng 1: Tọa độ sẵn trong ghi chú';
          status = 'matched';
        }

        // Tầng 2: Mỏ neo SĐT 9 số
        if (!matched && p9 && dmsP9Map[p9]) {
          let cands = dmsP9Map[p9];
          matched = cands[0];
          tier = 'Tầng 2: Trùng SĐT tuyệt đối';
          status = 'matched';
        }

        // Tầng 4: Mỏ neo Địa bàn / Tuyến đường + Tên tương đồng
        if (!matched && (tokens.length || roads.size)) {
          let bestCand = null;
          let bestScore = 0;

          dmsList.forEach(d => {
            let commonRoads = new Set([...roads].filter(r => d.roads.has(r)));
            let roadScore = commonRoads.size ? 40 : 0;
            let nameScore = calcJaccardSimilarity(tokens, d.tokens) * 0.6;
            let total = roadScore + nameScore;
            if (total > bestScore) {
              bestScore = total;
              bestCand = d;
            }
          });

          if (bestCand && bestScore >= 75) {
            matched = bestCand;
            tier = `Tầng 4: Trùng đường & tên (${Math.round(bestScore)}%)`;
            status = 'matched';
          } else if (bestCand && bestScore >= 45) {
            suggestedDms = bestCand;
            matchScore = Math.round(bestScore);
            tier = `Gợi ý: Cùng khu vực/tuyến đường (${matchScore}%)`;
            status = 'suggest';
          }
        }

        kvList.push({
          id, name, addr,
          phone: std || phoneRaw,
          status, tier,
          lat: matched ? matched.lat : null,
          lon: matched ? matched.lon : null,
          matchedAddr: matched ? matched.addr : addr,
          suggestedDms, matchScore
        });
      });

      renderDmsMarkersOnMap();
      updateStatistics();
      renderCustomerList();
      saveStateToStorage();
      lucide.createIcons();
    }

    // =========================================================================
    // 5. HIỂN THỊ MAP & TƯƠNG TÁC GÁN TỌA ĐỘ
    // =========================================================================
    function renderDmsMarkersOnMap() {
      if (!map) return;
      dmsLayerGroup.clearLayers();

      dmsList.forEach(d => {
        let marker = L.circleMarker([d.lat, d.lon], {
          radius: 4,
          fillColor: '#2563eb',
          color: '#1d4ed8',
          weight: 1,
          opacity: 0.8,
          fillOpacity: 0.6
        });

        marker.bindPopup(`
          <div class="space-y-1">
            <div class="font-bold text-slate-800">${d.name}</div>
            <div class="text-slate-500 text-[11px]">${d.addr}</div>
            <div class="text-blue-600 font-mono text-[11px]">SĐT: ${d.stdPhone || 'Chưa có'}</div>
            <button onclick="assignDmsToSelected('${d.code}')" class="mt-1 w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-1 rounded text-[11px]">
              Gán tọa độ cho KH KiotViet đang chọn
            </button>
          </div>
        `);
        dmsLayerGroup.addLayer(marker);
      });
      map.invalidateSize();
    }

    window.assignDmsToSelected = function(dmsCode) {
      if (!selectedCustId) return alert("Vui lòng chọn 1 quán KiotViet bên trái trước!");
      let dms = dmsList.find(d => d.code === dmsCode);
      let kv = kvList.find(k => k.id === selectedCustId);
      if (dms && kv) {
        kv.lat = dms.lat;
        kv.lon = dms.lon;
        kv.matchedAddr = dms.addr;
        kv.status = 'matched';
        kv.tier = 'Gán trực tiếp từ Bản Đồ';
        kv.suggestedDms = null;
        map.closePopup();
        updateStatistics();
        renderCustomerList();
        selectCustomer(kv.id);
        saveStateToStorage();
      }
    };

    function changeTab(tab) {
      currentTab = tab;
      document.getElementById('tabBtnSuggest').className = tab === 'suggest' ? "flex-1 py-1 text-center rounded font-semibold text-amber-800 bg-white shadow-sm" : "flex-1 py-1 text-center rounded text-slate-600";
      document.getElementById('tabBtnPending').className = tab === 'pending' ? "flex-1 py-1 text-center rounded font-semibold text-rose-800 bg-white shadow-sm" : "flex-1 py-1 text-center rounded text-slate-600";
      document.getElementById('tabBtnMatched').className = tab === 'matched' ? "flex-1 py-1 text-center rounded font-semibold text-emerald-800 bg-white shadow-sm" : "flex-1 py-1 text-center rounded text-slate-600";
      renderCustomerList();
    }

    function filterCustomerList() {
      renderCustomerList();
    }

    function renderCustomerList() {
      let query = removeDiacritics(document.getElementById('searchInput').value.trim());
      let filtered = kvList.filter(k => {
        if (k.status !== currentTab) return false;
        if (!query) return true;
        let matchText = removeDiacritics(k.name + ' ' + k.id + ' ' + k.phone + ' ' + k.addr);
        return matchText.includes(query);
      });

      let container = document.getElementById('customerListView');
      if (!filtered.length) {
        container.innerHTML = `<div class="p-6 text-center text-xs text-slate-400">Không có khách hàng trong mục này.</div>`;
        return;
      }

      container.innerHTML = filtered.slice(0, 100).map(k => {
        let isSelected = (k.id === selectedCustId);
        let borderClass = isSelected ? "border-l-4 border-blue-600 bg-blue-50/70" : "hover:bg-slate-50";

        let badge = k.status === 'matched' 
          ? `<span class="text-[10px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded font-semibold">Đã có Map</span>`
          : (k.status === 'suggest' 
              ? `<span class="text-[10px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded font-semibold">${k.matchScore}%</span>`
              : `<span class="text-[10px] bg-rose-100 text-rose-700 px-1.5 py-0.5 rounded font-semibold">Chưa có Map</span>`);

        return `
          <div onclick="selectCustomer('${k.id}')" class="p-2.5 cursor-pointer transition ${borderClass}">
            <div class="flex items-center justify-between gap-1">
              <span class="text-xs font-bold text-slate-900 truncate">${k.name}</span>
              ${badge}
            </div>
            <div class="text-[11px] text-slate-500 mt-0.5 flex gap-2">
              <span>Mã: <strong class="text-slate-700">${k.id}</strong></span>
              <span>SĐT: <strong class="text-blue-600">${k.phone || 'Trống'}</strong></span>
            </div>
            <div class="text-[10px] text-slate-400 truncate">${k.addr}</div>

            ${k.status === 'suggest' && k.suggestedDms ? `
              <div class="mt-1.5 p-1.5 bg-amber-50 rounded border border-amber-200 text-[11px] text-amber-900 flex justify-between items-center">
                <div class="truncate mr-2">
                  <div class="font-bold truncate text-[11px]">${k.suggestedDms.name}</div>
                  <div class="text-[10px] text-amber-600 truncate">${k.suggestedDms.addr}</div>
                </div>
                <button onclick="approveSuggest(event, '${k.id}')" class="bg-amber-500 hover:bg-amber-600 text-white text-[10px] font-bold px-2 py-1 rounded shrink-0 shadow">
                  Duyệt gộp
                </button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    window.selectCustomer = function(id) {
      selectedCustId = id;
      let k = kvList.find(x => x.id === id);
      if (!k) return;

      document.getElementById('selectedCustName').innerText = `${k.name} (${k.id})`;
      selectedMarkerGroup.clearLayers();

      let targetLat = k.lat || (k.suggestedDms ? k.suggestedDms.lat : null);
      let targetLon = k.lon || (k.suggestedDms ? k.suggestedDms.lon : null);

      if (targetLat && targetLon && map) {
        map.flyTo([targetLat, targetLon], 16, { duration: 0.6 });

        let targetMarker = L.marker([targetLat, targetLon], {
          icon: L.divIcon({
            className: 'custom-pin',
            html: `
              <div class="relative flex items-center justify-center">
                <span class="animate-ping absolute inline-flex h-7 w-7 rounded-full bg-rose-400 opacity-75"></span>
                <div class="w-5 h-5 bg-rose-600 rounded-full border border-white shadow-lg flex items-center justify-center text-white text-[9px] font-bold">★</div>
              </div>
            `,
            iconSize: [20, 20],
            iconAnchor: [10, 10]
          })
        }).bindPopup(`<b>${k.name}</b><br><span class="text-xs text-slate-500">${k.matchedAddr || k.addr}</span>`).openPopup();

        selectedMarkerGroup.addLayer(targetMarker);
      }
      renderCustomerList();
    };

    window.approveSuggest = function(event, id) {
      event.stopPropagation();
      let k = kvList.find(x => x.id === id);
      if (k && k.suggestedDms) {
        k.lat = k.suggestedDms.lat;
        k.lon = k.suggestedDms.lon;
        k.matchedAddr = k.suggestedDms.addr;
        k.status = 'matched';
        k.tier = 'Duyệt thủ công từ gợi ý';
        k.suggestedDms = null;

        updateStatistics();
        renderCustomerList();
        selectCustomer(k.id);
        saveStateToStorage();
      }
    };

    function updateStatistics() {
      let total = kvList.length;
      let matched = kvList.filter(k => k.status === 'matched').length;
      let suggest = kvList.filter(k => k.status === 'suggest').length;
      let pending = kvList.filter(k => k.status === 'pending').length;

      document.getElementById('statTotal').innerText = total;
      document.getElementById('statMatched').innerText = matched;
      document.getElementById('statSuggest').innerText = suggest;
      document.getElementById('statPending').innerText = pending;

      document.getElementById('badgeSuggest').innerText = suggest;
      document.getElementById('badgePending').innerText = pending;
      document.getElementById('badgeMatched').innerText = matched;
    }

    // Modal Zalo / Google Maps
    function openZaloLinkModal() {
      if (!selectedCustId) return alert("Vui lòng chọn 1 quán trong danh sách bên trái trước!");
      let k = kvList.find(x => x.id === selectedCustId);
      document.getElementById('modalCustName').innerText = k.name;
      document.getElementById('modalUrlInput').value = '';
      document.getElementById('zaloModal').classList.remove('hidden');
    }

    function closeZaloLinkModal() {
      document.getElementById('zaloModal').classList.add('hidden');
    }

    function applyManualCoordinates() {
      let input = document.getElementById('modalUrlInput').value.trim();
      let k = kvList.find(x => x.id === selectedCustId);
      if (!input || !k) return;

      let match = input.match(/(1[0-2]\.\d{4,8})\s*[,;/\-\s]\s*(10[5-7]\.\d{4,8})/);
      if (match) {
        k.lat = parseFloat(match[1]);
        k.lon = parseFloat(match[2]);
        k.status = 'matched';
        k.tier = 'Gán qua Link / Tọa độ thủ công';
        k.suggestedDms = null;

        closeZaloLinkModal();
        updateStatistics();
        renderCustomerList();
        selectCustomer(k.id);
        saveStateToStorage();
      } else {
        alert("Không tìm thấy chuỗi tọa độ (Lat, Long). Vui lòng nhập dạng: 11.xxxx, 106.xxxx");
      }
    }

    function exportMasterExcel() {
      if (!kvList.length) return alert("Chưa có dữ liệu!");

      let masterRows = kvList.map(k => ({
        'Mã khách hàng KiotViet': k.id,
        'Tên khách hàng KiotViet': k.name,
        'SĐT chuẩn': k.phone,
        'Vĩ độ (Lat)': k.lat,
        'Kinh độ (Long)': k.lon,
        'Tọa độ GPS': (k.lat && k.lon) ? `${k.lat}, ${k.lon}` : '',
        'Địa chỉ thực tế tại Bình Dương': k.matchedAddr || k.addr,
        'Trạng thái': k.status === 'matched' ? 'Đã có GPS' : 'Chưa có GPS',
        'Cơ chế khớp': k.tier
      }));

      let wb = XLSX.utils.book_new();
      let ws1 = XLSX.utils.json_to_sheet(masterRows);
      XLSX.utils.book_append_sheet(wb, ws1, "Master_Data_KiotViet");
      XLSX.writeFile(wb, "Data_KhachHang_Master_KiotViet.xlsx");
    }

    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      lucide.createIcons();
      loadStateFromStorage();
    });
  </script>
</body>
</html>
